<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --negro:#0a0a0a; --gris:#6b6b6b; --borde:#e6e6e6; --fondo:#f4f4f4; --verde:#1fa855; --rojo:#c62828; --radio:12px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--fondo); color:var(--negro); font-family:Inter, -apple-system, sans-serif; font-size:15px; }
  body { padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font:inherit; color:inherit; }
  .top { position:sticky; top:0; z-index:20; background:var(--negro); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
  .top img { height:22px; }
  .top span { font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; opacity:.6; }
  .vista { display:none; padding:16px; max-width:640px; margin:0 auto; }
  .vista.activa { display:block; }
  h1 { font-family:'Barlow Condensed', sans-serif; font-size:1.7rem; font-weight:800; text-transform:uppercase; margin:4px 0 12px; }
  h2 { font-family:'Barlow Condensed', sans-serif; font-size:1.15rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin:22px 0 10px; }

  /* Barra inferior */
  .tabs { position:fixed; bottom:0; left:0; right:0; z-index:30; background:#fff; border-top:1px solid var(--borde); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; background:none; border:none; padding:12px 0 10px; font-size:.78rem; font-weight:600; color:var(--gris); display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tabs button svg { width:22px; height:22px; }
  .tabs button.activa { color:var(--negro); }

  /* Stock */
  .filtros { display:flex; gap:8px; margin-bottom:10px; }
  .chip { border:1.5px solid var(--borde); background:#fff; border-radius:20px; padding:7px 14px; font-size:.85rem; font-weight:600; }
  .chip.activa { background:var(--negro); border-color:var(--negro); color:#fff; }
  .buscar { width:100%; padding:12px 14px; border:1.5px solid var(--borde); border-radius:10px; background:#fff; margin-bottom:12px; font-size:16px; }
  .lista { display:flex; flex-direction:column; gap:10px; }
  .item { display:flex; gap:12px; background:#fff; border-radius:var(--radio); padding:10px; border:1px solid var(--borde); text-align:left; width:100%; }
  .item img, .item .sinfoto { width:88px; height:88px; border-radius:8px; object-fit:cover; background:#ddd; flex-shrink:0; }
  .item .info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .item .tit { font-weight:700; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .sub { color:var(--gris); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:2px 0 6px; }
  .item .precio { font-family:'Barlow Condensed', sans-serif; font-size:1.25rem; font-weight:800; }
  .badges { display:flex; gap:5px; margin-top:4px; flex-wrap:wrap; }
  .badge { font-size:.64rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:3px 7px; border-radius:4px; background:var(--negro); color:#fff; }
  .badge.claro { background:#fff; color:var(--negro); border:1px solid var(--negro); }
  .badge.dest { background:#ffd84d; color:var(--negro); }
  .badge.vend { background:var(--rojo); }
  .vacio { text-align:center; color:var(--gris); padding:40px 10px; }

  /* Formularios */
  .campo { margin-bottom:14px; }
  .campo label { display:block; font-size:.72rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  .campo input, .campo select, .campo textarea { width:100%; padding:13px 14px; border:1.5px solid var(--borde); border-radius:10px; background:#fff; font-size:16px; }
  .campo textarea { min-height:90px; resize:vertical; }
  .campo small { display:block; color:var(--gris); font-size:.75rem; margin-top:5px; }
  .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .segmento { display:flex; background:#e9e9e9; border-radius:10px; padding:4px; }
  .segmento button { flex:1; border:none; background:none; padding:10px; border-radius:8px; font-weight:700; font-size:.9rem; }
  .segmento button.activa { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .switch { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1.5px solid var(--borde); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .switch input { width:46px; height:26px; appearance:none; -webkit-appearance:none; background:#ccc; border-radius:20px; position:relative; transition:.2s; }
  .switch input::after { content:''; position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; }
  .switch input:checked { background:var(--negro); }
  .switch input:checked::after { left:22px; }
  .btn { width:100%; border:none; border-radius:10px; padding:15px; font-weight:700; font-size:.95rem; letter-spacing:.5px; background:var(--negro); color:#fff; }
  .btn:disabled { opacity:.45; }
  .btn.sec { background:#fff; color:var(--negro); border:1.5px solid var(--negro); }
  .btn.verde { background:var(--verde); }
  .btn.rojo { background:#fff; color:var(--rojo); border:1.5px solid var(--rojo); }
  .acciones { display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  /* Fotos */
  .fotos { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px; }
  .foto { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:#ddd; }
  .foto img { width:100%; height:100%; object-fit:cover; }
  .foto .n { position:absolute; top:5px; left:5px; background:rgba(0,0,0,.7); color:#fff; font-size:.7rem; font-weight:700; padding:2px 7px; border-radius:10px; }
  .foto .n.port { background:#ffd84d; color:#000; }
  .foto .ctl { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; background:linear-gradient(transparent, rgba(0,0,0,.65)); padding:14px 4px 4px; }
  .foto .ctl button { background:rgba(255,255,255,.92); border:none; width:30px; height:30px; border-radius:50%; font-size:.85rem; font-weight:700; }
  .agregar { border:2px dashed #bbb; border-radius:8px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--gris); font-size:.8rem; font-weight:600; gap:4px; background:#fff; }
  .agregar b { font-size:1.6rem; line-height:1; color:var(--negro); }

  /* Hoja inferior (editar) */
  .velo { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; display:none; }
  .velo.ver { display:block; }
  .hoja { position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--fondo); border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; transform:translateY(105%); transition:transform .25s; max-width:640px; margin:0 auto; }
  .hoja.ver { transform:none; }
  .hoja .cab { display:flex; gap:12px; align-items:center; margin-bottom:16px; }
  .hoja .cab img { width:64px; height:64px; border-radius:8px; object-fit:cover; background:#ddd; }
  .hoja .cab .tit { font-weight:700; }
  .hoja .cab .sub { color:var(--gris); font-size:.82rem; }
  .link { display:block; text-align:center; color:var(--negro); font-weight:600; font-size:.88rem; padding:12px; text-decoration:underline; }

  /* Progreso y aviso */
  .progreso { position:fixed; inset:0; z-index:60; background:rgba(10,10,10,.92); color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; gap:16px; }
  .progreso.ver { display:flex; }
  .barra { width:100%; max-width:320px; height:8px; background:rgba(255,255,255,.2); border-radius:8px; overflow:hidden; }
  .barra div { height:100%; width:0; background:#fff; transition:width .3s; }
  .aviso { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:var(--negro); color:#fff; padding:12px 18px; border-radius:10px; font-size:.88rem; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:70; max-width:92vw; text-align:center; }
  .aviso.ver { opacity:1; transform:translate(-50%, 0); }
  .aviso.error { background:var(--rojo); }
  .cargando { text-align:center; color:var(--gris); padding:40px 0; }
</style>
</head>
<body>

<header class="top">
  <img src="https://adgautos.com.ar/img/logo-adg.png" alt="ADG Autos">
  <span>Panel</span>
</header>

<!-- ============ MI STOCK ============ -->
<section class="vista activa" id="vStock">
  <h1>Mi stock</h1>
  <div class="filtros">
    <button class="chip activa" data-f="disp">Publicados <span id="cDisp"></span></button>
    <button class="chip" data-f="vend">Vendidos / ocultos <span id="cVend"></span></button>
  </div>
  <input class="buscar" id="buscar" type="search" placeholder="Buscar (ej: Hilux, 2019)">
  <div class="lista" id="lista"><div class="cargando">Cargando stock…</div></div>
</section>

<!-- ============ CARGAR AUTO ============ -->
<section class="vista" id="vAlta">
  <h1>Cargar auto</h1>
  <form id="fAlta" autocomplete="off">
    <div class="campo">
      <div class="segmento" id="segTipo">
        <button type="button" class="activa" data-v="usado">Usado</button>
        <button type="button" data-v="0km">0km</button>
      </div>
    </div>

    <h2>Fotos</h2>
    <div class="fotos" id="fotos"></div>
    <input type="file" id="inFotos" accept="image/*" multiple hidden>
    <small style="display:block;color:var(--gris);font-size:.78rem;margin-bottom:6px">La primera es la portada (la que se ve en el catálogo y al compartir). Hasta 9 fotos. Usá ◀ ▶ para ordenarlas.</small>

    <h2>Datos</h2>
    <div class="fila2">
      <div class="campo"><label>Marca *</label><input id="aMarca" list="dlMarcas" required placeholder="Ej: Toyota"><datalist id="dlMarcas"></datalist></div>
      <div class="campo"><label>Modelo *</label><input id="aModelo" required placeholder="Ej: Hilux"></div>
    </div>
    <div class="campo"><label>Versión</label><input id="aVersion" placeholder="Ej: SRV 4x4 2.8 AT"></div>
    <div class="fila2">
      <div class="campo"><label>Año *</label><input id="aAnio" type="number" inputmode="numeric" required min="1990" max="2030" placeholder="2020"></div>
      <div class="campo soloUsado"><label>Kilómetros *</label><input id="aKm" inputmode="numeric" required placeholder="85.000"></div>
    </div>
    <div class="fila2">
      <div class="campo"><label>Combustible</label>
        <select id="aComb"><option>Nafta</option><option>Diesel</option><option>GNC</option><option>Hibrido</option><option>Electrico</option></select></div>
      <div class="campo"><label>Transmisión</label>
        <select id="aTrans"><option>Manual</option><option>Automatica</option><option>CVT</option></select></div>
    </div>
    <div class="fila2">
      <div class="campo"><label>Color</label><input id="aColor" placeholder="Ej: Gris plata"></div>
      <div class="campo soloUsado"><label>Precio ($) *</label><input id="aPrecio" inputmode="numeric" required placeholder="28.000.000"></div>
    </div>
    <div class="campo"><label>Descripción</label><textarea id="aDesc" placeholder="Ej: Único dueño, service oficial al día, cubiertas nuevas."></textarea></div>
    <div class="campo"><label>Equipamiento</label><textarea id="aEquip" placeholder="Uno por renglón&#10;Cámara de retroceso&#10;Techo panorámico&#10;Asientos de cuero"></textarea><small>Uno por renglón.</small></div>
    <label class="switch"><span>Destacarlo en la web</span><input type="checkbox" id="aDest"></label>

    <button class="btn verde" type="submit" id="btnPublicar">Publicar auto</button>
    <small style="display:block;text-align:center;color:var(--gris);font-size:.75rem;margin-top:10px">Aparece en el catálogo en unos minutos y con su página propia en hasta 30 minutos.</small>
  </form>
</section>

<nav class="tabs">
  <button class="activa" data-v="vStock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 7l2 6M3 13h18v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/><circle cx="7.5" cy="15.5" r=".5"/><circle cx="16.5" cy="15.5" r=".5"/></svg>
    Mi stock
  </button>
  <button data-v="vAlta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    Cargar auto
  </button>
</nav>

<!-- Hoja para editar un auto -->
<div class="velo" id="velo"></div>
<div class="hoja" id="hoja">
  <div class="cab"><img id="hFoto" alt=""><div><div class="tit" id="hTit"></div><div class="sub" id="hSub"></div></div></div>
  <div class="fila2">
    <div class="campo" id="hCampoPrecio"><label>Precio ($)</label><input id="hPrecio" inputmode="numeric"></div>
    <div class="campo" id="hCampoKm"><label>Kilómetros</label><input id="hKm" inputmode="numeric"></div>
  </div>
  <label class="switch"><span>Destacado en la web</span><input type="checkbox" id="hDest"></label>
  <div class="acciones">
    <button class="btn" id="hGuardar">Guardar cambios</button>
    <button class="btn rojo" id="hVendido">Marcar como vendido</button>
    <button class="btn sec" id="hRepublicar" hidden>Volver a publicar</button>
  </div>
  <a class="link" id="hVer" target="_blank" rel="noopener">Ver en la web</a>
</div>

<div class="progreso" id="progreso"><div id="pTxt">Subiendo…</div><div class="barra"><div id="pBarra"></div></div><small id="pSub" style="opacity:.6"></small></div>
<div class="aviso" id="aviso"></div>

<script>
  // Si algo falla al cargar, mostrarlo en pantalla en vez de quedar en "Cargando…"
  window.addEventListener('error', function (e) {
    var l = document.getElementById('lista');
    if (l) l.innerHTML = '<div class="vacio">Error en el panel: ' + String(e.message).replace(/</g, '&lt;') + '</div>';
  });
</script>
<script>
(function () {
  /* ---------- utilidades ---------- */
  const $ = id => document.getElementById(id);
  const miles = n => (Number(n) || 0).toLocaleString('es-AR');
  const soloNum = s => Number(String(s || '').replace(/\D/g, '')) || 0;
  function aviso(txt, error) {
    const a = $('aviso'); a.textContent = txt; a.className = 'aviso ver' + (error ? ' error' : '');
    clearTimeout(a._t); a._t = setTimeout(() => a.className = 'aviso', error ? 5000 : 3000);
  }
  function servidor(fn, ...args) {
    return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn](...args));
  }
  function formatoMiles(input) {
    input.addEventListener('input', () => {
      const n = input.value.replace(/\D/g, '').slice(0, 12);
      input.value = n ? Number(n).toLocaleString('es-AR') : '';
    });
  }
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- navegación ---------- */
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('activa', x === b));
    document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === b.dataset.v));
    window.scrollTo(0, 0);
  }));

  /* ---------- MI STOCK ---------- */
  let stock = [], filtro = 'disp', actual = null;

  async function cargarStock() {
    try {
      const r = await servidor('listarStock');
      stock = r.autos;
      $('dlMarcas').innerHTML = r.marcas.map(m => `<option value="${esc(m)}">`).join('');
      pintarStock();
    } catch (e) {
      $('lista').innerHTML = `<div class="vacio">No pude leer la planilla.<br><small>${esc(e.message)}</small></div>`;
    }
  }

  function pintarStock() {
    const q = $('buscar').value.trim().toLowerCase();
    const disp = stock.filter(a => a.disponible), vend = stock.filter(a => !a.disponible);
    $('cDisp').textContent = `(${disp.length})`; $('cVend').textContent = `(${vend.length})`;
    const lista = (filtro === 'disp' ? disp : vend).filter(a =>
      !q || `${a.marca} ${a.modelo} ${a.version} ${a.anio}`.toLowerCase().includes(q));
    if (!lista.length) { $('lista').innerHTML = `<div class="vacio">${q ? 'No hay autos con esa búsqueda.' : (filtro === 'disp' ? 'No hay autos publicados.' : 'No hay vendidos.')}</div>`; return; }
    $('lista').innerHTML = lista.map(a => `
      <button class="item" data-id="${esc(a.id)}">
        ${a.foto ? `<img src="${esc(a.foto)}" loading="lazy" alt="">` : '<div class="sinfoto"></div>'}
        <div class="info">
          <div class="tit">${esc(a.marca)} ${esc(a.modelo)}</div>
          <div class="sub">${esc(a.version)}${a.tipo === '0km' ? ' · 0km' : ` · ${esc(a.anio)} · ${miles(a.km)} km`}</div>
          <div class="precio">${a.tipo === '0km' || !a.precio ? 'Consultar' : '$ ' + miles(a.precio)}</div>
          <div class="badges">
            <span class="badge ${a.tipo === '0km' ? 'claro' : ''}">${a.tipo === '0km' ? '0km' : 'Usado'}</span>
            ${a.destacado ? '<span class="badge dest">Destacado</span>' : ''}
            ${!a.disponible ? '<span class="badge vend">Vendido / oculto</span>' : ''}
          </div>
        </div>
      </button>`).join('');
    document.querySelectorAll('.item').forEach(el => el.addEventListener('click', () => abrirHoja(el.dataset.id)));
  }

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    filtro = c.dataset.f;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('activa', x === c));
    pintarStock();
  }));
  $('buscar').addEventListener('input', pintarStock);

  /* ---------- editar ---------- */
  formatoMiles($('hPrecio')); formatoMiles($('hKm'));
  function abrirHoja(id) {
    actual = stock.find(a => a.id === id); if (!actual) return;
    const a = actual;
    $('hFoto').src = a.foto || ''; $('hTit').textContent = `${a.marca} ${a.modelo}`;
    $('hSub').textContent = `${a.version}${a.tipo === '0km' ? ' · 0km' : ' · ' + a.anio}`;
    $('hCampoPrecio').hidden = a.tipo === '0km'; $('hCampoKm').hidden = a.tipo === '0km';
    $('hPrecio').value = a.precio ? miles(a.precio) : ''; $('hKm').value = a.km ? miles(a.km) : '';
    $('hDest').checked = a.destacado;
    $('hVendido').hidden = !a.disponible; $('hRepublicar').hidden = a.disponible;
    $('hVer').href = 'https:' + '//adgautos.com.ar/?auto=' + encodeURIComponent(a.id); // (sin barra doble en template: HtmlService la toma como comentario) $('hVer').hidden = !a.disponible;
    $('velo').classList.add('ver'); $('hoja').classList.add('ver');
  }
  function cerrarHoja() { $('velo').classList.remove('ver'); $('hoja').classList.remove('ver'); actual = null; }
  $('velo').addEventListener('click', cerrarHoja);

  async function guardar(cambios, mensaje) {
    const a = actual; if (!a) return;
    document.querySelectorAll('#hoja .btn').forEach(b => b.disabled = true);
    try {
      await servidor('actualizarAuto', a.id, cambios);
      Object.assign(a, cambios);
      cerrarHoja(); pintarStock(); aviso(mensaje);
    } catch (e) { aviso('No se pudo guardar: ' + e.message, true); }
    finally { document.querySelectorAll('#hoja .btn').forEach(b => b.disabled = false); }
  }
  $('hGuardar').addEventListener('click', () => {
    const c = { destacado: $('hDest').checked };
    if (actual.tipo !== '0km') { c.precio = soloNum($('hPrecio').value); c.km = soloNum($('hKm').value); }
    guardar(c, 'Guardado. En la web en unos minutos.');
  });
  $('hVendido').addEventListener('click', () => {
    if (!confirm(`¿Marcar el ${actual.marca} ${actual.modelo} como vendido? Deja de verse en la web (su link muestra "vendido").`)) return;
    guardar({ disponible: false, destacado: false }, 'Marcado como vendido.');
  });
  $('hRepublicar').addEventListener('click', () => guardar({ disponible: true }, 'Publicado de nuevo.'));

  /* ---------- CARGAR AUTO ---------- */
  let tipo = 'usado', fotos = []; // fotos: [{ url (dataURL achicada) }]
  formatoMiles($('aKm')); formatoMiles($('aPrecio'));

  document.querySelectorAll('#segTipo button').forEach(b => b.addEventListener('click', () => {
    tipo = b.dataset.v;
    document.querySelectorAll('#segTipo button').forEach(x => x.classList.toggle('activa', x === b));
    document.querySelectorAll('.soloUsado').forEach(el => {
      el.hidden = tipo === '0km';
      el.querySelector('input').required = tipo !== '0km';
    });
    if (tipo === '0km' && !$('aAnio').value) $('aAnio').value = new Date().getFullYear();
  }));

  // Achica la foto en el celular: lado mayor 1600 px, JPEG 82 % (≈ 250-400 KB)
  function achicar(file) {
    return new Promise((ok, mal) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer ' + file.name)); };
      img.src = url;
    });
  }

  function pintarFotos() {
    const cont = $('fotos');
    cont.innerHTML = fotos.map((f, i) => `
      <div class="foto">
        <img src="${f.url}" alt="">
        <span class="n ${i === 0 ? 'port' : ''}">${i === 0 ? 'Portada' : i + 1}</span>
        <div class="ctl">
          <button type="button" data-a="izq" data-i="${i}" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>◀</button>
          <button type="button" data-a="borrar" data-i="${i}">✕</button>
          <button type="button" data-a="der" data-i="${i}" ${i === fotos.length - 1 ? 'disabled style="opacity:.3"' : ''}>▶</button>
        </div>
      </div>`).join('') +
      (fotos.length < 9 ? `<button type="button" class="agregar" id="btnAgregar"><b>+</b>${fotos.length ? 'Agregar' : 'Elegir fotos'}</button>` : '');
    const add = $('btnAgregar'); if (add) add.addEventListener('click', () => $('inFotos').click());
    cont.querySelectorAll('.ctl button').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      if (b.dataset.a === 'borrar') fotos.splice(i, 1);
      if (b.dataset.a === 'izq' && i > 0) [fotos[i - 1], fotos[i]] = [fotos[i], fotos[i - 1]];
      if (b.dataset.a === 'der' && i < fotos.length - 1) [fotos[i + 1], fotos[i]] = [fotos[i], fotos[i + 1]];
      pintarFotos();
    }));
  }

  $('inFotos').addEventListener('change', async e => {
    const archivos = [...e.target.files];
    e.target.value = '';
    const lugar = 9 - fotos.length;
    if (archivos.length > lugar) aviso(`Entran hasta 9 fotos: se agregan las primeras ${lugar}.`);
    for (const f of archivos.slice(0, lugar)) {
      try { fotos.push({ url: await achicar(f) }); pintarFotos(); }
      catch (err) { aviso(err.message, true); }
    }
  });

  function progreso(ver, txt, pct, sub) {
    $('progreso').classList.toggle('ver', ver);
    if (txt) $('pTxt').textContent = txt;
    if (pct != null) $('pBarra').style.width = pct + '%';
    $('pSub').textContent = sub || '';
  }

  $('fAlta').addEventListener('submit', async e => {
    e.preventDefault();
    if (!fotos.length) { aviso('Agregá al menos una foto.', true); return; }
    const datos = {
      tipo,
      marca: $('aMarca').value.trim(), modelo: $('aModelo').value.trim(), version: $('aVersion').value.trim(),
      anio: $('aAnio').value, km: soloNum($('aKm').value), precio: soloNum($('aPrecio').value),
      combustible: $('aComb').value, transmision: $('aTrans').value, color: $('aColor').value.trim(),
      descripcion: $('aDesc').value.trim(),
      equipamiento: $('aEquip').value.split('\n').map(s => s.trim()).filter(Boolean),
      destacado: $('aDest').checked
    };
    if (tipo === 'usado' && !datos.precio) { aviso('Falta el precio.', true); return; }

    let alta = null;
    $('btnPublicar').disabled = true;
    try {
      progreso(true, 'Creando el auto…', 5, '');
      alta = await servidor('iniciarAlta', datos);
      const links = [];
      for (let i = 0; i < fotos.length; i++) {
        progreso(true, `Subiendo fotos ${i + 1} de ${fotos.length}…`, 10 + Math.round(80 * i / fotos.length), 'No cierres esta pantalla');
        links.push(await servidor('subirFoto', alta.carpetaId, i + 1, fotos[i].url));
      }
      progreso(true, 'Publicando…', 95, '');
      await servidor('confirmarAlta', alta.id, links);
      progreso(true, '¡Listo!', 100, '');
      setTimeout(() => progreso(false), 700);
      aviso(`${datos.marca} ${datos.modelo} publicado.`);
      // limpiar formulario
      $('fAlta').reset(); fotos = []; pintarFotos();
      document.querySelector('#segTipo button[data-v="usado"]').click();
      await cargarStock();
      document.querySelector('.tabs button[data-v="vStock"]').click();
    } catch (err) {
      progreso(false);
      if (alta) { try { await servidor('cancelarAlta', alta.id, alta.carpetaId); } catch (e2) { } }
      aviso('No se pudo publicar: ' + (err.message || err) + '. No se guardó nada, probá de nuevo.', true);
    } finally {
      $('btnPublicar').disabled = false;
    }
  });

  // Evita cerrar sin querer con fotos cargadas
  window.addEventListener('beforeunload', e => { if (fotos.length) { e.preventDefault(); e.returnValue = ''; } });

  pintarFotos();
  cargarStock();
})();
</script>
</body>
</html>
