# Genera una página por auto (/autos/...) + sitemap a partir de la planilla de stock.
# Corre sola cada 30 minutos. Para forzarla al toque: pestaña Actions → "Páginas de autos" → Run workflow.
name: Páginas de autos

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generar_autos.py"
      - "autos/autos.css"
      - "script.js"
      - "styles.css"
      - "index.html"
      - ".github/workflows/autos.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: paginas-autos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (imágenes de vista previa)
        run: pip install --quiet pillow

      - name: Generar páginas desde la planilla
        run: python3 scripts/generar_autos.py

      - name: Publicar cambios
        id: publicar
        run: |
          git add -A autos sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el stock."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stock: actualizar páginas de autos"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "cambios=si" >> "$GITHUB_OUTPUT"

      - name: Pedir a GitHub Pages que publique
        if: steps.publicar.outputs.cambios == 'si'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
